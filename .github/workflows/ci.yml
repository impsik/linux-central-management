name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-and-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared release version
        run: python scripts/sync-version.py --check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: agent/go.sum
      - name: Test agent
        working-directory: agent
        run: go test ./...
      - name: Check agent with go vet
        working-directory: agent
        run: go vet ./...

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm deps
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Lint status colors (no legacy inline hex in templates)
        run: |
          set -euo pipefail
          echo "Checking commit: $(git rev-parse --short HEAD)"
          forbidden='(#86efac|#fca5a5|#fbbf24|#94a3b8|#a0aec0|#cbd5e1)'
          # Only check tracked template sources used by the UI runtime.
          matches=$(mktemp)
          if git ls-files -z 'server/app/templates/*.js' 'server/app/templates/index.html' \
            | xargs -0 grep -nE "$forbidden" > "$matches"; then
            cat "$matches"
            echo "❌ Found legacy status hex colors in templates. Use semantic classes or CSS vars instead."
            exit 1
          fi
          echo "✅ Status color lint passed"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fleet_ci
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest
      - name: Run backend smoke tests (fail fast)
        env:
          AGENT_SHARED_TOKEN: ci-token
          ALLOW_INSECURE_NO_AGENT_TOKEN: "true"
          DB_AUTO_CREATE_TABLES: "false"
          DB_REQUIRE_MIGRATIONS_UP_TO_DATE: "false"
        run: pytest server/tests/test_overview_reliability_smoke.py -q
      - name: Run full backend tests
        env:
          AGENT_SHARED_TOKEN: ci-token
          ALLOW_INSECURE_NO_AGENT_TOKEN: "true"
          DB_AUTO_CREATE_TABLES: "false"
          DB_REQUIRE_MIGRATIONS_UP_TO_DATE: "false"
        run: pytest server/tests -q
      - name: Migrate isolated PostgreSQL test database
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://fleet:ci-only-postgres-password@127.0.0.1:5432/fleet_ci
        run: alembic upgrade head
      - name: Verify concurrent PostgreSQL job claims
        env:
          FLEET_TEST_POSTGRES_URL: postgresql+psycopg://fleet:ci-only-postgres-password@127.0.0.1:5432/fleet_ci
        run: pytest server/tests/test_job_claim_concurrency.py -q
